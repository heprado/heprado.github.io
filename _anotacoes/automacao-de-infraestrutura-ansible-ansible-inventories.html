<p>Em ansible utilizamos um arquivo que pode ser escrito em formato INI
ou YAML, esse arquivo é utilizado para o ansible saber quais hosts ele
pode interagir:</p>
<h5 id="ini-format">INI Format</h5>
<div class="sourceCode" id="cb1"><pre
class="sourceCode ini"><code class="sourceCode ini"><span id="cb1-1"><a href="#cb1-1" aria-hidden="true" tabindex="-1"></a><span class="kw">[all]</span></span>
<span id="cb1-2"><a href="#cb1-2" aria-hidden="true" tabindex="-1"></a><span class="dt">192.168.0.1</span></span>
<span id="cb1-3"><a href="#cb1-3" aria-hidden="true" tabindex="-1"></a><span class="dt">192.168.0.2</span></span>
<span id="cb1-4"><a href="#cb1-4" aria-hidden="true" tabindex="-1"></a><span class="dt">192.168.0.3</span></span></code></pre></div>
<h5 id="yaml">YAML:</h5>
<div class="sourceCode" id="cb2"><pre
class="sourceCode yaml"><code class="sourceCode yaml"><span id="cb2-1"><a href="#cb2-1" aria-hidden="true" tabindex="-1"></a><span class="fu">all</span><span class="kw">:</span><span class="at">  </span></span>
<span id="cb2-2"><a href="#cb2-2" aria-hidden="true" tabindex="-1"></a><span class="at">	</span><span class="fu">hosts</span><span class="kw">:</span><span class="at">  </span></span>
<span id="cb2-3"><a href="#cb2-3" aria-hidden="true" tabindex="-1"></a><span class="at">		</span><span class="fu">192.168.0.1</span><span class="kw">:</span></span>
<span id="cb2-4"><a href="#cb2-4" aria-hidden="true" tabindex="-1"></a><span class="at">		</span><span class="fu">192.168.0.2</span><span class="kw">:</span></span>
<span id="cb2-5"><a href="#cb2-5" aria-hidden="true" tabindex="-1"></a><span class="at">		</span><span class="fu">192.168.0.3</span><span class="kw">:</span></span></code></pre></div>

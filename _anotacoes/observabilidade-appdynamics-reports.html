<p>No AppDynamics podemos criar reports automaticamente através de
modelos já prédefinidos, por padrão o report sai em PDF mas podemos
também customizar para esse report ser exportado em csv.</p>
<p>Esses reports podem ser on-demand ou scheduled caso queiramos fazer
um report por mês por exemplo.</p>
